name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore RedgifsDownloader.sln

      - name: Build solution (Release)
        run: dotnet build RedgifsDownloader.sln --configuration Release --no-restore

      - name: Publish Avalonia Native AOT (win-x64)
        run: >-
          dotnet publish src/RedgifsDownloader.Avalonia/RedgifsDownloader.Avalonia.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/win-x64

      - name: Upload Windows Native AOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedgifsDownloader-win-x64-native-aot
          path: artifacts/win-x64

  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Restore Core
        run: dotnet restore src/RedgifsDownloader.Core/RedgifsDownloader.Core.csproj

      - name: Build Core (Release)
        run: dotnet build src/RedgifsDownloader.Core/RedgifsDownloader.Core.csproj --configuration Release --no-restore

      - name: Restore CLI
        run: dotnet restore src/RedgifsDownloader.Cli/RedgifsDownloader.Cli.csproj

      - name: Build CLI (Release)
        run: dotnet build src/RedgifsDownloader.Cli/RedgifsDownloader.Cli.csproj --configuration Release --no-restore

      - name: Publish Avalonia Native AOT (linux-x64)
        run: >-
          dotnet publish src/RedgifsDownloader.Avalonia/RedgifsDownloader.Avalonia.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output artifacts/linux-x64

      - name: Upload Linux Native AOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedgifsDownloader-linux-x64-native-aot
          path: artifacts/linux-x64
